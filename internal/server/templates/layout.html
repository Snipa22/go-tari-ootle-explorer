<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>go-tari-ootle-explorer</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        body { font-family: monospace; margin: 2rem; background: #0f0f12; color: #e6e6e6; }
        a { color: #7cc7ff; }
        table { border-collapse: collapse; width: 100%; }
        th, td { text-align: left; padding: 0.4rem 0.8rem; border-bottom: 1px solid #333; }
        th { color: #999; }
        #load-more-row td { text-align: center; padding: 1rem; }
        button { background: #222; color: #e6e6e6; border: 1px solid #444; padding: 0.5rem 1rem; cursor: pointer; }
        button:hover { background: #333; }
        nav { margin-bottom: 1rem; color: #999; }
        nav a { margin-right: 0.8rem; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
        .stat-card { border: 1px solid #333; padding: 1rem; background: #17171b; }
        .stat-card .label { color: #999; font-size: 0.85rem; }
        .stat-card .value { font-size: 1.4rem; color: #7fffa0; }
        .panel { margin: 1.5rem 0; }
        .panel h3 { color: #999; font-size: 0.9rem; text-transform: uppercase; margin-bottom: 0.5rem; }
        .error-note { color: #ff8080; }
        .empty-note { color: #888; }
        .status-pending { color: #ffd57f; }
        .status-claimed { color: #7fffa0; }
        .status-stuck { color: #ff8080; }
        .status-filters { margin: 0.5rem 0 1rem 0; }
        .status-filters a { margin-right: 0.6rem; }
        .stuck-banner { border: 1px solid #ff8080; background: #221414; padding: 0.8rem; margin: 1rem 0; }
    </style>
</head>
<body>
<h1><a href="/">go-tari-ootle-explorer</a></h1>
<nav>
    <a href="/">Home</a> | <a href="/blocks">Blocks</a> | <a href="/validators">Validators</a> | <a href="/burn-claims">Burn Claims</a> | <a href="/templates">Templates</a> | <a href="/health">Health</a> | <a href="/api/docs">API Docs</a>
</nav>
{{block "content" .}}{{end}}
</body>
</html>
